<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>블로그 체험단 일정관리</title>
    <style>
      body { margin:0; font-family: Arial, sans-serif; background:#f5f5f5; color:#222; }
      .wrap { padding:16px; }
      .top { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
      .sort-btn { background:#f59e0b; color:#fff; border:none; border-radius:12px; padding:14px 18px; font-weight:700; }
      .summary { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:8px; flex:1; }
      .card { background:#e9ddff; border:1px solid #c7b7ec; border-radius:10px; padding:10px; font-size:13px; }
      .card strong { font-size:18px; display:block; margin-top:4px; }
      .panel { background:#fff; border:1px solid #ddd; border-radius:10px; padding:12px; margin-bottom:10px; }
      .grid { display:grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap:8px; }
      input, select, button { width:100%; padding:8px; border:1px solid #ccc; border-radius:8px; }
      button { cursor:pointer; }
      .table-wrap { overflow:auto; background:#fff; border:1px solid #ddd; border-radius:10px; }
      table { width:100%; border-collapse: collapse; min-width:1400px; font-size:13px; }
      th, td { border-bottom:1px solid #ececec; padding:8px 6px; text-align:left; white-space:nowrap; }
      th { background:#f3f4f6; position:sticky; top:0; }
      .badge { border-radius:999px; padding:2px 8px; font-size:12px; color:#fff; }
      .b-visit { background:#374151; }
      .b-delivery { background:#b91c1c; }
      .b-payback { background:#92400e; }
      .b-review { background:#1d4ed8; }
      .actions { display:flex; gap:6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <button class="sort-btn" id="sortBtn" type="button">정렬하기</button>
        <div class="summary">
          <div class="card">전체 건수<strong id="totalCnt">0</strong></div>
          <div class="card">방문/배달/페이백<strong id="typeCnt">0 / 0 / 0</strong></div>
          <div class="card">제공받은금액 합계<strong id="providedSum">0</strong></div>
          <div class="card">추가금액/총사용금액<strong id="extraAndUse">0 / 0</strong></div>
        </div>
      </div>

      <div class="panel">
        <h3>블로그 체험단 일정관리 - 항목 등록</h3>
        <form id="form" class="grid">
          <input name="site" placeholder="사이트" required />
          <input name="campaign" placeholder="캠페인명" required />
          <input name="region" placeholder="방문지역" />
          <select name="type" required>
            <option>방문형</option><option>제공형</option><option>페이백형</option><option>페이백+구매평</option><option>구매평</option><option>배달형</option>
          </select>
          <select name="delivery_done"><option>X</option><option>O</option></select>
          <input name="visit_date" type="date" />
          <input name="visit_time" type="time" />
          <input name="review_deadline" type="date" required />
          <select name="review_done"><option>X</option><option>O</option></select>
          <input name="provided" type="number" min="0" placeholder="제공받은금액" value="0" />
          <input name="extra" type="number" min="0" placeholder="추가금액" value="0" />
          <input name="payback" type="number" min="0" placeholder="페이백금액" value="0" />
          <select name="payback_done"><option>X</option><option>O</option></select>
          <input name="mission" placeholder="추가미션 (예: 네이버영수증리뷰/네이버클립)" />
          <button type="submit">등록</button>
        </form>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>사이트</th><th>캠페인</th><th>방문지역</th><th>유형</th><th>배송여부</th>
              <th>방문예약일</th><th>방문시간</th><th>방문잔여일</th><th>리뷰마감기한</th><th>마감잔여일</th>
              <th>리뷰등록</th><th>제공받은금액</th><th>추가금액</th><th>페이백금액</th><th>페이백완료</th><th>추가미션</th><th>관리</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <script>
      const form = document.getElementById('form');
      const tbody = document.getElementById('tbody');
      const totalCnt = document.getElementById('totalCnt');
      const typeCnt = document.getElementById('typeCnt');
      const providedSum = document.getElementById('providedSum');
      const extraAndUse = document.getElementById('extraAndUse');
      const sortBtn = document.getElementById('sortBtn');

      let store = { sites: [], types: [], classifications: ['방문','배송'], items: [] };

      const parseDate = (v) => v ? new Date(v + 'T00:00:00') : null;
      const dday = (v) => {
        if (!v) return '-';
        const t = parseDate(v); const n = new Date(); n.setHours(0,0,0,0);
        return Math.ceil((t - n) / (1000*60*60*24));
      };

      const typeBadge = (t) => {
        if (t === '방문형') return '<span class="badge b-visit">방문</span>';
        if (t === '배달형') return '<span class="badge b-delivery">배달</span>';
        if (t.includes('페이백')) return '<span class="badge b-payback">페이백</span>';
        return '<span class="badge b-review">일반</span>';
      };

      const load = async () => {
        const res = await fetch('/api/data');
        store = await res.json();
        store.items = store.items || [];
        render();
      };

      const save = async () => {
        await fetch('/api/data', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(store) });
      };

      const updateSummary = () => {
        const items = store.items;
        const visit = items.filter(i => i.type === '방문형').length;
        const delivery = items.filter(i => i.type === '배달형').length;
        const payback = items.filter(i => String(i.type).includes('페이백')).length;
        const pSum = items.reduce((a,b)=>a+(Number(b.provided)||0),0);
        const eSum = items.reduce((a,b)=>a+(Number(b.extra)||0),0);
        totalCnt.textContent = String(items.length);
        typeCnt.textContent = `${visit} / ${delivery} / ${payback}`;
        providedSum.textContent = pSum.toLocaleString();
        extraAndUse.textContent = `${eSum.toLocaleString()} / ${(pSum+eSum).toLocaleString()}`;
      };

      const render = () => {
        tbody.innerHTML = '';
        store.items.forEach((it, idx) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${it.site||''}</td>
            <td>${it.campaign||''}</td>
            <td>${it.region||'-'}</td>
            <td>${typeBadge(it.type||'')}</td>
            <td>${it.delivery_done||'X'}</td>
            <td>${it.visit_date||'-'}</td>
            <td>${it.visit_time||'-'}</td>
            <td>${it.visit_date ? dday(it.visit_date) : '-'}</td>
            <td>${it.review_deadline||'-'}</td>
            <td>${it.review_deadline ? dday(it.review_deadline) : '-'}</td>
            <td>${it.review_done||'X'}</td>
            <td>${Number(it.provided||0).toLocaleString()}</td>
            <td>${Number(it.extra||0).toLocaleString()}</td>
            <td>${Number(it.payback||0).toLocaleString()}</td>
            <td>${it.payback_done||'X'}</td>
            <td>${it.mission||'없음'}</td>
            <td><div class="actions"><button data-del="${idx}" type="button">삭제</button></div></td>
          `;
          tbody.appendChild(tr);
        });
        updateSummary();
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const item = Object.fromEntries(fd.entries());
        item.mission = item.mission?.trim() || '없음';
        store.items.push(item);
        await save();
        form.reset();
        form.delivery_done.value = 'X';
        form.review_done.value = 'X';
        form.payback_done.value = 'X';
        form.extra.value = '0';
        form.provided.value = '0';
        form.payback.value = '0';
        render();
      });

      tbody.addEventListener('click', async (e) => {
        const idx = e.target.getAttribute('data-del');
        if (idx === null) return;
        if (!confirm('삭제하시겠습니까?')) return;
        store.items.splice(Number(idx), 1);
        await save();
        render();
      });

      sortBtn.addEventListener('click', () => {
        store.items.sort((a,b)=>(a.review_deadline||'').localeCompare(b.review_deadline||''));
        render();
      });

      load();
    </script>
  </body>
</html>
