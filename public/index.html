<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>체험단 승인 일정 관리</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --muted: #94a3b8;
        --text: #e2e8f0;
        --primary: #22c55e;
        --warn: #f59e0b;
        --danger: #ef4444;
        --line: #1f2937;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(180deg, #020617, var(--bg));
        color: var(--text);
      }
      .container { max-width: 1080px; margin: 0 auto; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 1.7rem; }
      .desc { color: var(--muted); margin: 0 0 16px; }

      .menu {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .tab-btn {
        border: 1px solid #334155;
        background: #0b1220;
        color: #cbd5e1;
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
      }
      .tab-btn.active {
        background: #14532d;
        color: #dcfce7;
        border-color: #15803d;
      }

      .tab-panel { display: none; }
      .tab-panel.active { display: block; }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .card {
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }

      label { display: block; margin: 10px 0 6px; color: #cbd5e1; font-size: 0.9rem; }
      input, select, textarea, button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0b1220;
        color: var(--text);
        padding: 10px;
        font: inherit;
      }
      textarea { min-height: 70px; resize: vertical; }
      button.primary {
        margin-top: 14px;
        border: none;
        background: var(--primary);
        color: #052e16;
        font-weight: 700;
        cursor: pointer;
      }

      .inline {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      .inline button {
        width: auto;
        padding: 10px 12px;
        background: #1e293b;
        border: 1px solid #334155;
        cursor: pointer;
      }

      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #0b1220;
        border: 1px solid #334155;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 0.85rem;
      }
      .chip button {
        width: auto;
        margin: 0;
        border: none;
        background: #7f1d1d;
        color: #fee2e2;
        border-radius: 999px;
        padding: 2px 8px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .pill {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #0b1220;
      }
      .pill strong { display: block; margin-top: 4px; font-size: 1.3rem; }

      table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
      th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { text-align: left; color: #cbd5e1; }
      .type { padding: 2px 8px; border-radius: 999px; border: 1px solid #334155; font-size: 0.8rem; }

      .status-ok { color: var(--primary); }
      .status-warn { color: var(--warn); }
      .status-danger { color: var(--danger); }

      .ghost {
        background: #1e293b;
        color: #e2e8f0;
        border: none;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .ghost.danger { background: #7f1d1d; }

      .empty { color: var(--muted); text-align: center; padding: 26px 0; }

      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
        .summary { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>체험단 승인 일정 관리</h1>
      <p class="desc">혼자 사용하는 체험단 관리 도구입니다. 등록 메뉴와 목록 메뉴를 분리해 관리할 수 있습니다.</p>

      <nav class="menu">
        <button class="tab-btn active" data-tab="register" type="button">체험단 등록 메뉴</button>
        <button class="tab-btn" data-tab="list" type="button">체험단 목록 메뉴</button>
      </nav>

      <section id="tab-register" class="tab-panel active">
        <div class="grid">
          <article class="card">
            <h2>승인된 체험단 등록</h2>
            <form id="entry-form">
              <label for="campaignName">체험단 이름</label>
              <input id="campaignName" name="campaignName" placeholder="예: 강남 파스타 체험" required />

              <label for="siteName">체험단 사이트</label>
              <select id="siteName" name="siteName" required></select>

              <label for="type">체험단 유형</label>
              <select id="type" name="type" required></select>

              <label for="experienceDeadline">방문마감일</label>
              <input id="experienceDeadline" name="experienceDeadline" type="date" required />

              <label for="reviewDeadline">리뷰 마감기한</label>
              <input id="reviewDeadline" name="reviewDeadline" type="date" required />

              <label for="memo">메모</label>
              <textarea id="memo" name="memo" placeholder="방문시간, 조건, 링크 등"></textarea>

              <button class="primary" type="submit">등록하기</button>
            </form>
          </article>

          <article class="card">
            <h2>체험단 사이트 관리</h2>
            <div class="inline">
              <input id="siteInput" placeholder="새 사이트명 입력" />
              <button id="addSiteBtn" type="button">추가</button>
            </div>
            <div id="siteChips" class="chips"></div>

            <h2 style="margin-top:20px;">체험단 유형 관리</h2>
            <div class="inline">
              <input id="typeInput" placeholder="새 유형명 입력" />
              <button id="addTypeBtn" type="button">추가</button>
            </div>
            <div id="typeChips" class="chips"></div>
          </article>
        </div>
      </section>

      <section id="tab-list" class="tab-panel">
        <article class="card">
          <div class="summary">
            <div class="pill">총 승인 건수<strong id="totalCount">0</strong></div>
            <div class="pill">방문마감 임박(3일)<strong id="expiringCount">0</strong></div>
            <div class="pill">리뷰마감 임박(3일)<strong id="reviewDueCount">0</strong></div>
          </div>

          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>체험단</th>
                  <th>사이트</th>
                  <th>유형</th>
                  <th>방문마감일</th>
                  <th>리뷰 마감기한</th>
                  <th>상태</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="list-body"></tbody>
            </table>
          </div>
          <p id="empty" class="empty">아직 등록된 체험단이 없습니다.</p>
        </article>
      </section>
    </div>

    <script>
      const STORAGE_KEY_ITEMS = 'vibe-coding-campaigns-v2';
      const STORAGE_KEY_SITES = 'vibe-coding-sites-v1';
      const STORAGE_KEY_TYPES = 'vibe-coding-types-v1';

      const defaultSites = ['레뷰', '링블', '강남맛집체험단'];
      const defaultTypes = ['방문형', '배송형', '구매형'];

      const form = document.getElementById('entry-form');
      const listBody = document.getElementById('list-body');
      const emptyEl = document.getElementById('empty');
      const totalCount = document.getElementById('totalCount');
      const expiringCount = document.getElementById('expiringCount');
      const reviewDueCount = document.getElementById('reviewDueCount');

      const siteSelect = document.getElementById('siteName');
      const typeSelect = document.getElementById('type');
      const siteInput = document.getElementById('siteInput');
      const typeInput = document.getElementById('typeInput');
      const addSiteBtn = document.getElementById('addSiteBtn');
      const addTypeBtn = document.getElementById('addTypeBtn');
      const siteChips = document.getElementById('siteChips');
      const typeChips = document.getElementById('typeChips');

      const readJson = (key, fallback) => {
        try {
          const v = JSON.parse(localStorage.getItem(key));
          return Array.isArray(v) ? v : fallback;
        } catch {
          return fallback;
        }
      };
      const saveJson = (key, arr) => localStorage.setItem(key, JSON.stringify(arr));

      const getItems = () => readJson(STORAGE_KEY_ITEMS, []);
      const setItems = (items) => saveJson(STORAGE_KEY_ITEMS, items);

      const getSites = () => readJson(STORAGE_KEY_SITES, defaultSites);
      const setSites = (sites) => saveJson(STORAGE_KEY_SITES, sites);

      const getTypes = () => readJson(STORAGE_KEY_TYPES, defaultTypes);
      const setTypes = (types) => saveJson(STORAGE_KEY_TYPES, types);

      const toOptions = (select, values) => {
        select.innerHTML = '';
        values.forEach((value) => {
          const opt = document.createElement('option');
          opt.value = value;
          opt.textContent = value;
          select.appendChild(opt);
        });
      };

      const renderChips = (container, values, onRemove) => {
        container.innerHTML = '';
        values.forEach((value) => {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.innerHTML = `<span>${value}</span>`;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = '삭제';
          btn.addEventListener('click', () => onRemove(value));
          chip.appendChild(btn);
          container.appendChild(chip);
        });
      };

      const daysLeft = (dateText) => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(dateText + 'T00:00:00');
        return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      };

      const statusTag = (days) => {
        if (days < 0) return '<span class="status-danger">마감 지남</span>';
        if (days <= 3) return '<span class="status-warn">마감 임박</span>';
        return '<span class="status-ok">진행 중</span>';
      };

      const refreshSiteTypeUI = () => {
        const sites = getSites();
        const types = getTypes();
        toOptions(siteSelect, sites);
        toOptions(typeSelect, types);

        renderChips(siteChips, sites, (name) => {
          const updated = getSites().filter((s) => s !== name);
          if (updated.length === 0) {
            alert('최소 1개의 사이트는 유지해야 합니다.');
            return;
          }
          setSites(updated);
          refreshSiteTypeUI();
        });

        renderChips(typeChips, types, (name) => {
          const updated = getTypes().filter((t) => t !== name);
          if (updated.length === 0) {
            alert('최소 1개의 유형은 유지해야 합니다.');
            return;
          }
          setTypes(updated);
          refreshSiteTypeUI();
        });
      };

      const renderList = () => {
        const items = getItems().sort((a, b) => a.reviewDeadline.localeCompare(b.reviewDeadline));
        listBody.innerHTML = '';

        let expiring = 0;
        let reviewDue = 0;

        items.forEach((item, index) => {
          const expDays = daysLeft(item.experienceDeadline);
          const revDays = daysLeft(item.reviewDeadline);
          if (expDays >= 0 && expDays <= 3) expiring += 1;
          if (revDays >= 0 && revDays <= 3) reviewDue += 1;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${item.campaignName}</strong><br><small style="color:#94a3b8">${item.memo ? item.memo.replace(/</g, '&lt;') : ''}</small></td>
            <td>${item.siteName}</td>
            <td><span class="type">${item.type}</span></td>
            <td>${item.experienceDeadline}<br><small>${expDays}일 남음</small></td>
            <td>${item.reviewDeadline}<br><small>${revDays}일 남음</small></td>
            <td>방문: ${statusTag(expDays)}<br>리뷰: ${statusTag(revDays)}</td>
            <td><button class="ghost danger" data-remove="${index}" type="button">삭제</button></td>
          `;
          listBody.appendChild(tr);
        });

        totalCount.textContent = String(items.length);
        expiringCount.textContent = String(expiring);
        reviewDueCount.textContent = String(reviewDue);
        emptyEl.style.display = items.length ? 'none' : 'block';
      };

      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
        });
      });

      addSiteBtn.addEventListener('click', () => {
        const value = siteInput.value.trim();
        if (!value) return;
        const sites = getSites();
        if (sites.includes(value)) {
          alert('이미 존재하는 사이트입니다.');
          return;
        }
        sites.push(value);
        setSites(sites);
        siteInput.value = '';
        refreshSiteTypeUI();
      });

      addTypeBtn.addEventListener('click', () => {
        const value = typeInput.value.trim();
        if (!value) return;
        const types = getTypes();
        if (types.includes(value)) {
          alert('이미 존재하는 유형입니다.');
          return;
        }
        types.push(value);
        setTypes(types);
        typeInput.value = '';
        refreshSiteTypeUI();
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const fd = new FormData(form);
        const item = {
          campaignName: fd.get('campaignName').trim(),
          siteName: fd.get('siteName'),
          type: fd.get('type'),
          experienceDeadline: fd.get('experienceDeadline'),
          reviewDeadline: fd.get('reviewDeadline'),
          memo: fd.get('memo').trim()
        };

        if (item.reviewDeadline < item.experienceDeadline) {
          alert('리뷰 마감기한은 방문마감일보다 빠를 수 없습니다.');
          return;
        }

        const items = getItems();
        items.push(item);
        setItems(items);
        form.reset();
        refreshSiteTypeUI();
        renderList();
        document.querySelector('[data-tab="list"]').click();
      });

      listBody.addEventListener('click', (event) => {
        const idx = event.target.getAttribute('data-remove');
        if (idx === null) return;
        const items = getItems();
        items.splice(Number(idx), 1);
        setItems(items);
        renderList();
      });

      refreshSiteTypeUI();
      renderList();
    </script>
  </body>
</html>
