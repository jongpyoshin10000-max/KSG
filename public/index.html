<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>헬로키티 체험단 일정 관리</title>
    <style>
      :root {
        --bg-main: #fff7fb;
        --bg-soft: #ffe4f2;
        --panel: #ffffff;
        --line: #f9a8d4;
        --text: #7a284e;
        --muted: #9d4f73;
        --primary: #ec4899;
        --primary-dark: #be185d;
        --warn: #d97706;
        --danger: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 20% 20%, #fff 0%, #ffeaf5 45%, #ffd7ea 100%);
        overflow-x: hidden;
      }
      body::before,
      body::after {
        content: '';
        position: fixed;
        inset: -10% 0 0 0;
        pointer-events: none;
        z-index: 0;
        background-repeat: repeat;
        animation: sakuraFall linear infinite;
      }
      body::before {
        opacity: 0.45;
        background-image:
          radial-gradient(circle at 10px 10px, rgba(255, 170, 200, 0.9) 0 6px, transparent 7px),
          radial-gradient(circle at 30px 26px, rgba(255, 196, 220, 0.85) 0 5px, transparent 6px),
          radial-gradient(circle at 58px 14px, rgba(255, 182, 210, 0.9) 0 4px, transparent 5px);
        background-size: 120px 120px;
        animation-duration: 22s;
      }
      body::after {
        opacity: 0.3;
        background-image:
          radial-gradient(circle at 16px 12px, rgba(255, 210, 230, 0.8) 0 5px, transparent 6px),
          radial-gradient(circle at 44px 38px, rgba(255, 170, 205, 0.75) 0 4px, transparent 5px),
          radial-gradient(circle at 74px 24px, rgba(255, 200, 225, 0.75) 0 6px, transparent 7px);
        background-size: 150px 150px;
        animation-duration: 30s;
      }
      @keyframes sakuraFall {
        from { transform: translateY(-10%) translateX(0); }
        to { transform: translateY(110%) translateX(24px); }
      }
      .container { max-width: none; width: 100%; margin: 0 auto; padding: 24px; }
      .container, .modal {
        position: relative;
        z-index: 1;
      }
      h1 { margin: 0 0 8px; font-size: 1.8rem; }
      .desc { margin: 0 0 16px; color: var(--muted); }

      .menu { display: flex; gap: 8px; margin-bottom: 14px; }
      .tab-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
        font-weight: 600;
      }
      .tab-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary-dark);
      }

      .tab-panel { display: none; }
      .tab-panel.active { display: block; }

      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .card {
        background: var(--panel);
        border: 1px solid #fbcfe8;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(236, 72, 153, 0.08);
      }
      .list-card {
        width: 100%;
      }

      label { display: block; margin: 10px 0 6px; color: var(--muted); font-size: 0.9rem; }
      input, select, textarea, button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid #f9a8d4;
        background: #fff;
        color: var(--text);
        padding: 10px;
        font: inherit;
      }
      textarea { min-height: 70px; resize: vertical; }
      button.primary {
        margin-top: 14px;
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      .inline { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .inline button {
        width: auto;
        background: #fdf2f8;
        border: 1px solid #f9a8d4;
        cursor: pointer;
      }

      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #fff0f6;
        border: 1px solid #f9a8d4;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 0.85rem;
      }
      .chip button {
        width: auto;
        margin: 0;
        border: none;
        background: #fda4af;
        color: #7f1d1d;
        border-radius: 999px;
        padding: 2px 8px;
      }

      .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
      .pill {
        border: 1px solid #fbcfe8;
        border-radius: 10px;
        padding: 10px;
        background: #fff;
      }
      .pill strong { display: block; margin-top: 4px; font-size: 1.3rem; }

      table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
      th, td { padding: 10px 8px; border-bottom: 1px solid #fbcfe8; vertical-align: top; }
      th { text-align: left; color: var(--muted); }
      .type { padding: 2px 8px; border-radius: 999px; border: 1px solid #f9a8d4; font-size: 0.8rem; background: #fff0f6; }

      .status-ok { color: var(--primary-dark); }
      .status-warn { color: var(--warn); }
      .status-danger { color: var(--danger); }

      .ghost {
        background: #fdf2f8;
        color: var(--text);
        border: 1px solid #f9a8d4;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .ghost.danger { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }

      .empty { color: var(--muted); text-align: center; padding: 26px 0; }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
      }
      .modal.show { display: flex; }
      .modal-card {
        width: min(680px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: #fff;
        border: 1px solid #fbcfe8;
        border-radius: 14px;
        padding: 16px;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }

      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
        .summary { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>체험단 일정관리</h1>
      <p class="desc">데이터는 서버의 별도 파일에 저장되어 코드 업데이트 후에도 유지됩니다.</p>

      <nav class="menu">
        <button class="tab-btn active" data-tab="register" type="button">체험단 등록 메뉴</button>
        <button class="tab-btn" data-tab="list" type="button">체험단 목록 메뉴</button>
      </nav>

      <section id="tab-register" class="tab-panel active">
        <div class="grid">
          <article class="card">
            <h2>승인된 체험단 등록</h2>
            <form id="entry-form">
              <label for="type">체험단 유형</label>
              <select id="type" name="type" required></select>

              <label for="siteName">체험단 사이트</label>
              <select id="siteName" name="siteName" required></select>

              <label for="campaignName">체험단 이름</label>
              <input id="campaignName" name="campaignName" placeholder="예: 강남 파스타 체험" required />

              <div id="paybackCategoryFields" style="display:none;">
                <label for="paybackCategory">구분</label>
                <select id="paybackCategory" name="paybackCategory"></select>
              </div>

              <div id="visitRegionGroup">
                <label for="visitRegion">방문지역</label>
                <input id="visitRegion" name="visitRegion" placeholder="예: 서울 강남구" required />
              </div>

              <label for="providedAmount">제공받은금액</label>
              <input id="providedAmount" name="providedAmount" type="number" min="0" step="100" placeholder="예: 50000" required />

              <label for="additionalCost">추가비용</label>
              <input id="additionalCost" name="additionalCost" type="text" value="없음" />

              <div id="paybackFields" style="display:none;">
                <label for="paybackAmount">페이백금액</label>
                <input id="paybackAmount" name="paybackAmount" type="number" min="0" step="100" placeholder="예: 5000" value="0" />
              </div>

              <label id="experienceDeadlineLabel" for="experienceDeadline">방문예약일시</label>
              <input id="experienceDeadline" name="experienceDeadline" type="datetime-local" required />

              <div id="shippingFields" style="display:none;">
                <label for="shippingDone">배송여부 (O / X)</label>
                <select id="shippingDone" name="shippingDone">
                  <option value="X">X</option>
                  <option value="O">O</option>
                </select>

              </div>

              <label for="additionalMission">추가미션</label>
              <textarea id="additionalMission" name="additionalMission" placeholder="예: 네이버영수증리뷰 / 네이버클립">없음</textarea>

              <label for="reviewDeadline">리뷰 마감기한</label>
              <input id="reviewDeadline" name="reviewDeadline" type="date" required />

              <button id="submitBtn" class="primary" type="submit">등록하기</button>
            </form>
          </article>

          <article class="card">
            <h2>체험단 사이트 관리</h2>
            <div class="inline">
              <input id="siteInput" placeholder="새 사이트명 입력" />
              <button id="addSiteBtn" type="button">추가</button>
            </div>
            <div id="siteChips" class="chips"></div>

            <h2 style="margin-top:20px;">체험단 유형관리</h2>
            <div class="inline">
              <input id="typeInput" placeholder="새 유형명 입력" />
              <button id="addTypeBtn" type="button">추가</button>
            </div>
            <div id="typeChips" class="chips"></div>

            <h2 style="margin-top:20px;">체험단 구분관리</h2>
            <div class="inline">
              <input id="classificationInput" placeholder="새 구분명 입력" />
              <button id="addClassificationBtn" type="button">추가</button>
            </div>
            <div id="classificationChips" class="chips"></div>
          </article>
        </div>
      </section>

      <section id="tab-list" class="tab-panel">
        <article class="card list-card">
          <div class="summary">
            <div class="pill">총 승인 건수<strong id="totalCount">0</strong></div>
            <div class="pill">방문예약 임박(3일)<strong id="expiringCount">0</strong></div>
            <div class="pill">리뷰마감 임박(3일)<strong id="reviewDueCount">0</strong></div>
          </div>

          <div class="menu" style="margin-bottom:8px;">
            <button id="calendarModeBtn" class="tab-btn active" type="button">달력 보기</button>
            <button id="tableModeBtn" class="tab-btn" type="button">목록 보기</button>
          </div>

          <div id="calendarSection">
            <div class="inline" style="margin-bottom:8px;">
            <button id="prevMonthBtn" type="button">이전 달</button>
            <button id="nextMonthBtn" type="button">다음 달</button>
            </div>
            <h3 id="calendarLabel" style="margin:8px 0;"></h3>
            <div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:16px;"></div>
          </div>

          <div id="tableSection" style="overflow-x:auto; display:none;">
            <table>
              <thead>
                <tr>
                  <th>유형</th>
                  <th>체험단</th>
                  <th>사이트</th>
                  <th>방문예약일시</th>
                  <th>리뷰 마감기한</th>
                  <th>상태</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="list-body"></tbody>
            </table>
          </div>
          <p id="empty" class="empty">아직 등록된 체험단이 없습니다.</p>
        </article>
      </section>
    </div>

    <div id="deleteModal" class="modal" aria-hidden="true">
      <div class="modal-card">
        <h3>삭제 확인</h3>
        <p>정말로 삭제하시겠습니까?</p>
        <div class="modal-actions">
          <button id="deleteCancelBtn" class="ghost" type="button">취소</button>
          <button id="deleteConfirmBtn" class="ghost danger" type="button">삭제</button>
        </div>
      </div>
    </div>

    <div id="editModal" class="modal" aria-hidden="true">
      <div class="modal-card">
        <h3>체험단 데이터 수정</h3>
        <form id="editForm">
          <label for="editType">체험단 유형</label>
          <select id="editType" name="type" required></select>

          <label for="editSiteName">체험단 사이트</label>
          <select id="editSiteName" name="siteName" required></select>

          <label for="editCampaignName">체험단 이름</label>
          <input id="editCampaignName" name="campaignName" required />

          <div id="editPaybackCategoryFields" style="display:none;">
            <label for="editPaybackCategory">구분</label>
            <select id="editPaybackCategory" name="paybackCategory"></select>
          </div>

          <div id="editVisitRegionGroup">
            <label for="editVisitRegion">방문지역</label>
            <input id="editVisitRegion" name="visitRegion" required />
          </div>

          <label for="editProvidedAmount">제공받은금액</label>
          <input id="editProvidedAmount" name="providedAmount" type="number" min="0" step="100" required />

          <div id="editPaybackFields" style="display:none;">
            <label for="editPaybackAmount">페이백금액</label>
            <input id="editPaybackAmount" name="paybackAmount" type="number" min="0" step="100" value="0" />
          </div>

          <label id="editExperienceDeadlineLabel" for="editExperienceDeadline">방문예약일시</label>
          <input id="editExperienceDeadline" name="experienceDeadline" type="datetime-local" required />

          <div id="editShippingFields" style="display:none;">
            <label for="editShippingDone">배송여부 (O / X)</label>
            <select id="editShippingDone" name="shippingDone">
              <option value="X">X</option>
              <option value="O">O</option>
            </select>
          </div>

          <div id="editVisitFields" style="display:none;">
            <label for="editVisitTime">방문시간</label>
            <input id="editVisitTime" name="visitTime" type="time" />

            <label for="editExtraUsageAmount">추가사용금액</label>
            <input id="editExtraUsageAmount" name="extraUsageAmount" type="number" min="0" step="100" value="0" />
          </div>

          <label for="editAdditionalCost">추가비용</label>
          <input id="editAdditionalCost" name="additionalCost" type="text" value="없음" />

          <label for="editAdditionalMissionAll">추가미션</label>
          <textarea id="editAdditionalMissionAll" name="additionalMission" placeholder="예: 네이버영수증리뷰 / 네이버클립">없음</textarea>

          <label for="editReviewDeadline">리뷰 마감기한</label>
          <input id="editReviewDeadline" name="reviewDeadline" type="date" required />

          <div class="modal-actions">
            <button id="editCancelBtn" class="ghost" type="button">취소</button>
            <button class="primary" type="submit">수정 저장</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const form = document.getElementById('entry-form');
      const listBody = document.getElementById('list-body');
      const emptyEl = document.getElementById('empty');
      const totalCount = document.getElementById('totalCount');
      const expiringCount = document.getElementById('expiringCount');
      const reviewDueCount = document.getElementById('reviewDueCount');

      const siteSelect = document.getElementById('siteName');
      const typeSelect = document.getElementById('type');
      const siteInput = document.getElementById('siteInput');
      const typeInput = document.getElementById('typeInput');
      const classificationInput = document.getElementById('classificationInput');
      const addSiteBtn = document.getElementById('addSiteBtn');
      const addTypeBtn = document.getElementById('addTypeBtn');
      const addClassificationBtn = document.getElementById('addClassificationBtn');
      const siteChips = document.getElementById('siteChips');
      const typeChips = document.getElementById('typeChips');
      const classificationChips = document.getElementById('classificationChips');
      const paybackFields = document.getElementById('paybackFields');
      const paybackCategoryFields = document.getElementById('paybackCategoryFields');
      const paybackCategory = document.getElementById('paybackCategory');
      const visitRegionGroup = document.getElementById('visitRegionGroup');
      const shippingFields = document.getElementById('shippingFields');
      const experienceDeadlineLabel = document.getElementById('experienceDeadlineLabel');
      const prevMonthBtn = document.getElementById('prevMonthBtn');
      const nextMonthBtn = document.getElementById('nextMonthBtn');
      const calendarModeBtn = document.getElementById('calendarModeBtn');
      const tableModeBtn = document.getElementById('tableModeBtn');
      const calendarSection = document.getElementById('calendarSection');
      const tableSection = document.getElementById('tableSection');
      const calendarLabel = document.getElementById('calendarLabel');
      const calendarGrid = document.getElementById('calendarGrid');
      const deleteModal = document.getElementById('deleteModal');
      const deleteCancelBtn = document.getElementById('deleteCancelBtn');
      const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');
      const editModal = document.getElementById('editModal');
      const editForm = document.getElementById('editForm');
      const editType = document.getElementById('editType');
      const editSiteName = document.getElementById('editSiteName');
      const editPaybackCategoryFields = document.getElementById('editPaybackCategoryFields');
      const editPaybackCategory = document.getElementById('editPaybackCategory');
      const editVisitRegionGroup = document.getElementById('editVisitRegionGroup');
      const editPaybackFields = document.getElementById('editPaybackFields');
      const editPaybackAmount = document.getElementById('editPaybackAmount');
      const editShippingFields = document.getElementById('editShippingFields');
      const editAdditionalCost = document.getElementById('editAdditionalCost');
      const editExperienceDeadlineLabel = document.getElementById('editExperienceDeadlineLabel');
      const editVisitFields = document.getElementById('editVisitFields');
      const editAdditionalMissionAll = document.getElementById('editAdditionalMissionAll');
      const editCancelBtn = document.getElementById('editCancelBtn');

      let store = { sites: [], types: [], classifications: ['방문', '배송'], items: [] };
      let pendingDeleteIndex = null;
      let pendingEditIndex = null;
      let currentCalendarDate = new Date();

      const apiGet = async () => {
        const res = await fetch('/api/data');
        if (!res.ok) throw new Error('데이터 조회 실패');
        return res.json();
      };

      const apiSave = async () => {
        const res = await fetch('/api/data', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(store)
        });
        if (!res.ok) throw new Error('데이터 저장 실패');
      };

      const toOptions = (select, values) => {
        select.innerHTML = '';
        values.forEach((value) => {
          const opt = document.createElement('option');
          opt.value = value;
          opt.textContent = value;
          select.appendChild(opt);
        });
      };

      const renderChips = (container, values, onRemove) => {
        container.innerHTML = '';
        values.forEach((value) => {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.innerHTML = `<span>${value}</span>`;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = '삭제';
          btn.addEventListener('click', () => onRemove(value));
          chip.appendChild(btn);
          container.appendChild(chip);
        });
      };

      const parseDateTime = (value) => {
        if (!value) return new Date(NaN);
        return new Date(value.includes('T') ? value : `${value}T00:00:00`);
      };
      const daysLeft = (dateText) => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = parseDateTime(dateText);
        return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      };
      const dateWithDay = (dateText) => {
        const date = parseDateTime(dateText);
        const week = ['일', '월', '화', '수', '목', '금', '토'];
        const value = dateText.includes('T') ? dateText.replace('T', ' ') : dateText;
        return `${value} (${week[date.getDay()]})`;
      };

      const statusTag = (days) => {
        if (days < 0) return '<span class="status-danger">마감 지남</span>';
        if (days <= 3) return '<span class="status-warn">마감 임박</span>';
        return '<span class="status-ok">진행 중</span>';
      };
      const isPaybackType = (typeName) => typeName === '페이백형' || typeName === '페이백+구매평';
      const isDeliveryType = (typeName) => typeName === '배달형';
      const isVisitType = (typeName) => typeName === '방문형';
      const isPaybackDelivery = (typeName, classification) => isPaybackType(typeName) && classification === '배송';
      const isPaybackVisit = (typeName, classification) => isPaybackType(typeName) && classification !== '배송';
      const syncPaybackFields = () => {
        const isDelivery = isDeliveryType(typeSelect.value) || isPaybackDelivery(typeSelect.value, paybackCategory.value);
        visitRegionGroup.style.display = isDelivery ? 'none' : 'block';
        form.visitRegion.required = !isDelivery;
        paybackFields.style.display = isPaybackType(typeSelect.value) ? 'block' : 'none';
        paybackCategoryFields.style.display = isPaybackType(typeSelect.value) ? 'block' : 'none';
        shippingFields.style.display = isDelivery ? 'block' : 'none';
        experienceDeadlineLabel.textContent = isDelivery ? '배송완료일' : '방문예약일시';
      };
      const syncEditPaybackFields = () => {
        const isDelivery = isDeliveryType(editType.value) || isPaybackDelivery(editType.value, editPaybackCategory.value);
        editVisitRegionGroup.style.display = isDelivery ? 'none' : 'block';
        editForm.visitRegion.required = !isDelivery;
        editPaybackFields.style.display = isPaybackType(editType.value) ? 'block' : 'none';
        editPaybackCategoryFields.style.display = isPaybackType(editType.value) ? 'block' : 'none';
        editShippingFields.style.display = isDelivery ? 'block' : 'none';
        editVisitFields.style.display = isVisitType(editType.value) || isPaybackVisit(editType.value, editPaybackCategory.value) ? 'block' : 'none';
        editExperienceDeadlineLabel.textContent = isDelivery ? '배송완료일' : '방문예약일시';
      };
      const openModal = (modal) => {
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
      };
      const closeModal = (modal) => {
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
      };
      const setListMode = (mode) => {
        const isCalendar = mode === 'calendar';
        calendarSection.style.display = isCalendar ? 'block' : 'none';
        tableSection.style.display = isCalendar ? 'none' : 'block';
        calendarModeBtn.classList.toggle('active', isCalendar);
        tableModeBtn.classList.toggle('active', !isCalendar);
      };

      const renderSiteTypeUI = () => {
        toOptions(siteSelect, store.sites);
        toOptions(typeSelect, store.types);
        toOptions(paybackCategory, store.classifications || ['방문', '배송']);
        toOptions(editSiteName, store.sites);
        toOptions(editType, store.types);
        toOptions(editPaybackCategory, store.classifications || ['방문', '배송']);
        syncPaybackFields();
        syncEditPaybackFields();

        renderChips(siteChips, store.sites, async (name) => {
          if (store.sites.length <= 1) {
            alert('최소 1개의 사이트는 유지해야 합니다.');
            return;
          }
          store.sites = store.sites.filter((s) => s !== name);
          await apiSave();
          renderSiteTypeUI();
        });

        renderChips(typeChips, store.types, async (name) => {
          if (store.types.length <= 1) {
            alert('최소 1개의 유형은 유지해야 합니다.');
            return;
          }
          store.types = store.types.filter((t) => t !== name);
          await apiSave();
          renderSiteTypeUI();
        });

        renderChips(classificationChips, store.classifications || ['방문', '배송'], async (name) => {
          if (!store.classifications || store.classifications.length <= 1) {
            alert('최소 1개의 구분은 유지해야 합니다.');
            return;
          }
          store.classifications = store.classifications.filter((c) => c !== name);
          await apiSave();
          renderSiteTypeUI();
        });
      };

      const renderList = () => {
        const items = store.items
          .map((item, idx) => ({ item, idx }))
          .sort((a, b) => a.item.reviewDeadline.localeCompare(b.item.reviewDeadline));
        listBody.innerHTML = '';

        let expiring = 0;
        let reviewDue = 0;

        items.forEach(({ item, idx }) => {
          const expDays = daysLeft(item.experienceDeadline);
          const revDays = daysLeft(item.reviewDeadline);
          if (expDays >= 0 && expDays <= 3) expiring += 1;
          if (revDays >= 0 && revDays <= 3) reviewDue += 1;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="type">${item.type}</span></td>
            <td>
              <strong>${item.campaignName}</strong><br>
              ${isPaybackType(item.type) ? `<small style="color:#9d4f73">구분: ${item.paybackCategory || '-'}</small><br>` : ''}
              ${!(isDeliveryType(item.type) || isPaybackDelivery(item.type, item.paybackCategory)) ? `<small style="color:#9d4f73">방문지역: ${item.visitRegion || '-'}</small><br>` : ''}
              <small style="color:#9d4f73">제공받은금액: ${(Number(item.providedAmount) || 0).toLocaleString()}원</small><br>
              <small style="color:#9d4f73">추가비용: ${item.additionalCost || '없음'}</small><br>
              ${(isVisitType(item.type) || isPaybackVisit(item.type, item.paybackCategory)) ? `<small style="color:#9d4f73">방문시간: ${item.visitTime || '-'}</small><br>` : ''}
              ${(isVisitType(item.type) || isPaybackVisit(item.type, item.paybackCategory)) ? `<small style="color:#9d4f73">추가사용금액: ${(Number(item.extraUsageAmount) || 0).toLocaleString()}원</small><br>` : ''}
              <small style="color:#9d4f73">추가미션: ${item.additionalMission || '없음'}</small><br>
              ${isPaybackType(item.type) ? `<small style="color:#9d4f73">페이백금액: ${(Number(item.paybackAmount) || 0).toLocaleString()}원</small><br>` : ''}
              ${(isDeliveryType(item.type) || isPaybackDelivery(item.type, item.paybackCategory)) ? `<small style="color:#9d4f73">배송여부: ${item.shippingDone || 'X'}</small><br>` : ''}
            </td>
            <td>${item.siteName}</td>
            <td>${dateWithDay(item.experienceDeadline)}<br><small>${expDays}일 남음</small></td>
            <td>${dateWithDay(item.reviewDeadline)}<br><small>${revDays}일 남음</small></td>
            <td>방문: ${statusTag(expDays)}<br>리뷰: ${statusTag(revDays)}</td>
            <td>
              <button class="ghost" data-edit="${idx}" type="button">수정</button>
              <button class="ghost danger" data-remove="${idx}" type="button">삭제</button>
            </td>
          `;
          listBody.appendChild(tr);
        });

        totalCount.textContent = String(items.length);
        expiringCount.textContent = String(expiring);
        reviewDueCount.textContent = String(reviewDue);
        emptyEl.style.display = items.length ? 'none' : 'block';
        renderCalendar(items.map((v) => v.item));
      };

      const renderCalendar = (items) => {
        const y = currentCalendarDate.getFullYear();
        const m = currentCalendarDate.getMonth();
        calendarLabel.textContent = `${y}년 ${m + 1}월`;
        calendarGrid.innerHTML = '';
        ['일', '월', '화', '수', '목', '금', '토'].forEach((d) => {
          const el = document.createElement('div');
          el.style.fontWeight = '700';
          el.style.textAlign = 'center';
          el.textContent = d;
          calendarGrid.appendChild(el);
        });

        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const mapped = {};
        items.forEach((item) => {
          const d = parseDateTime(item.experienceDeadline);
          if (d.getFullYear() === y && d.getMonth() === m) {
            const day = d.getDate();
            mapped[day] = mapped[day] || [];
            mapped[day].push(item);
          }
        });

        for (let i = 0; i < firstDay; i += 1) {
          const blank = document.createElement('div');
          calendarGrid.appendChild(blank);
        }
        for (let day = 1; day <= daysInMonth; day += 1) {
          const cell = document.createElement('div');
          cell.style.border = '1px solid #fbcfe8';
          cell.style.borderRadius = '8px';
          cell.style.padding = '6px';
          cell.style.minHeight = '90px';
          cell.innerHTML = `<strong>${day}</strong>`;
          const list = mapped[day] || [];
          list.slice(0, 3).forEach((it) => {
            const p = document.createElement('div');
            p.style.fontSize = '12px';
            p.style.marginTop = '4px';
            p.textContent = `• ${it.campaignName}`;
            cell.appendChild(p);
          });
          if (list.length > 3) {
            const more = document.createElement('div');
            more.style.fontSize = '12px';
            more.textContent = `+${list.length - 3}건`;
            cell.appendChild(more);
          }
          calendarGrid.appendChild(cell);
        }
      };

      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
        });
      });

      addSiteBtn.addEventListener('click', async () => {
        const value = siteInput.value.trim();
        if (!value) return;
        if (store.sites.includes(value)) {
          alert('이미 존재하는 사이트입니다.');
          return;
        }
        store.sites.push(value);
        await apiSave();
        siteInput.value = '';
        renderSiteTypeUI();
      });

      addTypeBtn.addEventListener('click', async () => {
        const value = typeInput.value.trim();
        if (!value) return;
        if (store.types.includes(value)) {
          alert('이미 존재하는 유형입니다.');
          return;
        }
        store.types.push(value);
        await apiSave();
        typeInput.value = '';
        renderSiteTypeUI();
      });
      addClassificationBtn.addEventListener('click', async () => {
        const value = classificationInput.value.trim();
        if (!value) return;
        store.classifications = store.classifications || ['방문', '배송'];
        if (store.classifications.includes(value)) {
          alert('이미 존재하는 구분입니다.');
          return;
        }
        store.classifications.push(value);
        await apiSave();
        classificationInput.value = '';
        renderSiteTypeUI();
      });
      prevMonthBtn.addEventListener('click', () => {
        currentCalendarDate = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth() - 1, 1);
        renderList();
      });
      nextMonthBtn.addEventListener('click', () => {
        currentCalendarDate = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth() + 1, 1);
        renderList();
      });
      calendarModeBtn.addEventListener('click', () => setListMode('calendar'));
      tableModeBtn.addEventListener('click', () => setListMode('table'));
      typeSelect.addEventListener('change', syncPaybackFields);
      paybackCategory.addEventListener('change', syncPaybackFields);

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const fd = new FormData(form);
        const selectedType = fd.get('type');
        const selectedPaybackCategory = isPaybackType(selectedType) ? fd.get('paybackCategory') : '';
        const isDeliveryContext = isDeliveryType(selectedType) || isPaybackDelivery(selectedType, selectedPaybackCategory);
        const isVisitContext = isVisitType(selectedType) || isPaybackVisit(selectedType, selectedPaybackCategory);
        const item = {
          type: selectedType,
          paybackCategory: selectedPaybackCategory,
          siteName: fd.get('siteName'),
          campaignName: fd.get('campaignName').trim(),
          visitRegion: isDeliveryContext ? '' : fd.get('visitRegion').trim(),
          providedAmount: fd.get('providedAmount'),
          paybackAmount: isPaybackType(selectedType) ? fd.get('paybackAmount') : '0',
          shippingDone: isDeliveryContext ? fd.get('shippingDone') : '',
          additionalCost: (fd.get('additionalCost') || '없음').trim() || '없음',
          visitTime: isVisitContext ? (fd.get('visitTime') || '') : '',
          extraUsageAmount: isVisitContext ? (fd.get('extraUsageAmount') || '0') : '0',
          additionalMission: (fd.get('additionalMission') || '없음').trim() || '없음',
          experienceDeadline: fd.get('experienceDeadline'),
          reviewDeadline: fd.get('reviewDeadline')
        };

        if (parseDateTime(item.reviewDeadline) < parseDateTime(item.experienceDeadline)) {
          alert('리뷰 마감기한은 방문예약일시보다 빠를 수 없습니다.');
          return;
        }

        store.items.push(item);
        await apiSave();
        form.reset();
        renderSiteTypeUI();
        renderList();
        document.querySelector('[data-tab="list"]').click();
      });

      listBody.addEventListener('click', async (event) => {
        const editIdx = event.target.getAttribute('data-edit');
        if (editIdx !== null) {
          const item = store.items[Number(editIdx)];
          if (!item) return;
          pendingEditIndex = Number(editIdx);
          editType.value = item.type || '';
          editPaybackCategory.value = item.paybackCategory || (store.classifications && store.classifications[0]) || '방문';
          editSiteName.value = item.siteName || '';
          editForm.campaignName.value = item.campaignName || '';
          editForm.visitRegion.value = item.visitRegion || '';
          editForm.providedAmount.value = item.providedAmount || '';
          syncEditPaybackFields();
          editPaybackAmount.value = item.paybackAmount || '0';
          editForm.shippingDone.value = item.shippingDone || 'X';
          editAdditionalCost.value = item.additionalCost || '없음';
          editForm.visitTime.value = item.visitTime || '';
          editForm.extraUsageAmount.value = item.extraUsageAmount || '0';
          editAdditionalMissionAll.value = item.additionalMission || '없음';
          editForm.experienceDeadline.value = item.experienceDeadline || '';
          editForm.reviewDeadline.value = item.reviewDeadline || '';
          openModal(editModal);
          return;
        }

        const removeIdx = event.target.getAttribute('data-remove');
        if (removeIdx === null) return;
        pendingDeleteIndex = Number(removeIdx);
        openModal(deleteModal);
      });

      deleteCancelBtn.addEventListener('click', () => {
        pendingDeleteIndex = null;
        closeModal(deleteModal);
      });

      deleteConfirmBtn.addEventListener('click', async () => {
        if (pendingDeleteIndex === null) return;
        store.items.splice(Number(pendingDeleteIndex), 1);
        pendingDeleteIndex = null;
        closeModal(deleteModal);
        await apiSave();
        renderList();
      });

      editType.addEventListener('change', syncEditPaybackFields);
      editPaybackCategory.addEventListener('change', syncEditPaybackFields);
      editCancelBtn.addEventListener('click', () => {
        pendingEditIndex = null;
        closeModal(editModal);
      });

      editForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (pendingEditIndex === null) return;
        const fd = new FormData(editForm);
        const selectedType = fd.get('type');
        const selectedPaybackCategory = isPaybackType(selectedType) ? fd.get('paybackCategory') : '';
        const isDeliveryContext = isDeliveryType(selectedType) || isPaybackDelivery(selectedType, selectedPaybackCategory);
        const isVisitContext = isVisitType(selectedType) || isPaybackVisit(selectedType, selectedPaybackCategory);
        const item = {
          type: selectedType,
          paybackCategory: selectedPaybackCategory,
          siteName: fd.get('siteName'),
          campaignName: fd.get('campaignName').trim(),
          visitRegion: isDeliveryContext ? '' : fd.get('visitRegion').trim(),
          providedAmount: fd.get('providedAmount'),
          paybackAmount: isPaybackType(selectedType) ? fd.get('paybackAmount') : '0',
          shippingDone: isDeliveryContext ? fd.get('shippingDone') : '',
          additionalCost: (fd.get('additionalCost') || '없음').trim() || '없음',
          visitTime: isVisitContext ? (fd.get('visitTime') || '') : '',
          extraUsageAmount: isVisitContext ? (fd.get('extraUsageAmount') || '0') : '0',
          additionalMission: (fd.get('additionalMission') || '없음').trim() || '없음',
          experienceDeadline: fd.get('experienceDeadline'),
          reviewDeadline: fd.get('reviewDeadline')
        };

        if (parseDateTime(item.reviewDeadline) < parseDateTime(item.experienceDeadline)) {
          alert('리뷰 마감기한은 방문예약일시보다 빠를 수 없습니다.');
          return;
        }

        store.items[pendingEditIndex] = item;
        pendingEditIndex = null;
        closeModal(editModal);
        await apiSave();
        renderList();
      });

      (async () => {
        try {
          store = await apiGet();
          if (!Array.isArray(store.classifications) || store.classifications.length === 0) {
            store.classifications = ['방문', '배송'];
          }
          setListMode('calendar');
          renderSiteTypeUI();
          renderList();
        } catch {
          alert('초기 데이터를 불러오지 못했습니다. 서버 상태를 확인해주세요.');
        }
      })();
    </script>
  </body>
</html>
