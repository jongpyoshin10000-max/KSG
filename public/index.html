<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>슬기의 바이브코딩</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #111827, #1f2937);
        color: #f9fafb;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        text-align: center;
        padding: 2.5rem;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 0.75rem;
      }

      p {
        margin: 0;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>바이브코딩 시작</h1>
      <p>첫 페이지입니다.</p>
    </main>
  </body>
</html>
