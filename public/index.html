<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>체험단 승인 일정 관리</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --muted: #94a3b8;
        --text: #e2e8f0;
        --primary: #22c55e;
        --warn: #f59e0b;
        --danger: #ef4444;
        --line: #1f2937;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(180deg, #020617, var(--bg));
        color: var(--text);
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 24px;
      }

      .title {
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.7rem;
      }

      .desc {
        color: var(--muted);
        margin: 0;
      }

      .layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 16px;
      }

      .card {
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }

      label {
        display: block;
        margin-top: 10px;
        margin-bottom: 6px;
        font-size: 0.9rem;
        color: #cbd5e1;
      }

      input, select, textarea, button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0b1220;
        color: var(--text);
        padding: 10px;
        font: inherit;
      }

      textarea { min-height: 80px; resize: vertical; }

      button {
        margin-top: 14px;
        cursor: pointer;
        border: none;
        background: var(--primary);
        color: #052e16;
        font-weight: 700;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #0b1220;
      }

      .pill strong { display: block; font-size: 1.3rem; margin-top: 4px; }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.93rem;
      }

      th, td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th { color: #cbd5e1; text-align: left; }

      .type {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.78rem;
        border: 1px solid #334155;
      }

      .actions {
        display: flex;
        gap: 6px;
      }

      .ghost {
        background: #1e293b;
        color: #e2e8f0;
        padding: 6px 8px;
        margin: 0;
      }

      .danger {
        background: #7f1d1d;
      }

      .status-ok { color: var(--primary); }
      .status-warn { color: var(--warn); }
      .status-danger { color: var(--danger); }

      .empty {
        color: var(--muted);
        text-align: center;
        padding: 30px 0;
      }

      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="title">
        <h1>체험단 승인 일정 관리</h1>
        <p class="desc">나 혼자 사용하는 체험단 관리 페이지입니다. 승인된 체험단의 체험기간/리뷰 마감기한을 기록하고 마감 임박 항목을 확인하세요.</p>
      </header>

      <section class="layout">
        <article class="card">
          <h2>승인된 체험단 추가</h2>
          <form id="entry-form">
            <label for="campaignName">체험단 이름</label>
            <input id="campaignName" name="campaignName" placeholder="예: 강남 파스타 방문형" required />

            <label for="siteName">체험단 사이트</label>
            <input id="siteName" name="siteName" placeholder="예: 레뷰, 링블" required />

            <label for="type">체험단 유형</label>
            <select id="type" name="type" required>
              <option value="방문형">방문형</option>
              <option value="배송형">배송형</option>
              <option value="구매형">구매형</option>
            </select>

            <label for="experienceDeadline">체험기간 마감일</label>
            <input id="experienceDeadline" name="experienceDeadline" type="date" required />

            <label for="reviewDeadline">리뷰 마감기한</label>
            <input id="reviewDeadline" name="reviewDeadline" type="date" required />

            <label for="memo">메모</label>
            <textarea id="memo" name="memo" placeholder="방문 시간, 영수증 조건 등"></textarea>

            <button type="submit">목록에 추가</button>
          </form>
        </article>

        <article class="card">
          <div class="summary">
            <div class="pill">총 승인 건수<strong id="totalCount">0</strong></div>
            <div class="pill">체험 마감 임박(3일)<strong id="expiringCount">0</strong></div>
            <div class="pill">리뷰 마감 임박(3일)<strong id="reviewDueCount">0</strong></div>
          </div>

          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>체험단</th>
                  <th>유형</th>
                  <th>체험 마감</th>
                  <th>리뷰 마감</th>
                  <th>상태</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="list-body"></tbody>
            </table>
          </div>
          <p id="empty" class="empty">아직 등록된 승인 체험단이 없습니다.</p>
        </article>
      </section>
    </div>

    <script>
      const STORAGE_KEY = 'vibe-coding-campaigns-v1';
      const form = document.getElementById('entry-form');
      const listBody = document.getElementById('list-body');
      const emptyEl = document.getElementById('empty');
      const totalCount = document.getElementById('totalCount');
      const expiringCount = document.getElementById('expiringCount');
      const reviewDueCount = document.getElementById('reviewDueCount');

      const load = () => {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
          return [];
        }
      };

      const save = (items) => localStorage.setItem(STORAGE_KEY, JSON.stringify(items));

      const daysLeft = (dateText) => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(dateText + 'T00:00:00');
        const ms = target - today;
        return Math.ceil(ms / (1000 * 60 * 60 * 24));
      };

      const statusTag = (days) => {
        if (days < 0) return '<span class="status-danger">마감 지남</span>';
        if (days <= 3) return '<span class="status-warn">마감 임박</span>';
        return '<span class="status-ok">진행 중</span>';
      };

      const render = () => {
        const items = load().sort((a, b) => a.reviewDeadline.localeCompare(b.reviewDeadline));
        listBody.innerHTML = '';

        let expiring = 0;
        let reviewDue = 0;

        items.forEach((item, index) => {
          const expDays = daysLeft(item.experienceDeadline);
          const revDays = daysLeft(item.reviewDeadline);
          if (expDays >= 0 && expDays <= 3) expiring += 1;
          if (revDays >= 0 && revDays <= 3) reviewDue += 1;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <strong>${item.campaignName}</strong><br>
              <small style="color:#94a3b8">${item.siteName}</small><br>
              <small style="color:#94a3b8">${item.memo ? item.memo.replace(/</g, '&lt;') : ''}</small>
            </td>
            <td><span class="type">${item.type}</span></td>
            <td>${item.experienceDeadline}<br><small>${expDays}일 남음</small></td>
            <td>${item.reviewDeadline}<br><small>${revDays}일 남음</small></td>
            <td>
              체험: ${statusTag(expDays)}<br>
              리뷰: ${statusTag(revDays)}
            </td>
            <td>
              <div class="actions">
                <button class="ghost danger" data-remove="${index}" type="button">삭제</button>
              </div>
            </td>
          `;
          listBody.appendChild(tr);
        });

        totalCount.textContent = String(items.length);
        expiringCount.textContent = String(expiring);
        reviewDueCount.textContent = String(reviewDue);
        emptyEl.style.display = items.length ? 'none' : 'block';
      };

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const item = {
          campaignName: formData.get('campaignName').trim(),
          siteName: formData.get('siteName').trim(),
          type: formData.get('type'),
          experienceDeadline: formData.get('experienceDeadline'),
          reviewDeadline: formData.get('reviewDeadline'),
          memo: formData.get('memo').trim()
        };

        if (item.reviewDeadline < item.experienceDeadline) {
          alert('리뷰 마감기한은 체험 마감일보다 빠를 수 없습니다.');
          return;
        }

        const items = load();
        items.push(item);
        save(items);
        form.reset();
        render();
      });

      listBody.addEventListener('click', (event) => {
        const removeIndex = event.target.getAttribute('data-remove');
        if (removeIndex === null) return;

        const items = load();
        items.splice(Number(removeIndex), 1);
        save(items);
        render();
      });

      render();
    </script>
  </body>
</html>
